name: Build APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      server_url:
        description: '内置服务器地址（留空则用仓库变量 DS_SERVER_URL，否则用默认值）'
        required: false
        default: ''

permissions:
  contents: write

env:
  DS_SERVER_URL: ${{ github.event.inputs.server_url || vars.DS_SERVER_URL }}

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 不使用 android-actions/setup-android（已被强制跑在 Node 24 上导致失败）
      # 直接用 runner 预装的 Android SDK
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            for c in /usr/local/lib/android/sdk /opt/android-sdk "$HOME/Android/Sdk"; do
              if [ -d "$c" ]; then SDK="$c"; break; fi
            done
          fi
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::未找到 Android SDK"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          echo "SDK 路径: $SDK"
          ls "$SDK"

      - name: Install Android SDK platform 34
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_SDK_ROOT"
          SM=""
          for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" \
                   "$SDK/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$c" ]; then SM="$c"; break; fi
          done
          if [ -z "$SM" ]; then SM="$(command -v sdkmanager || true)"; fi
          if [ -z "$SM" ]; then
            echo "::notice::未找到 sdkmanager，跳过安装（镜像通常已预装 platform 34）"
            exit 0
          fi
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" || true
          "$SM" --list_installed | sed -n '1,40p' || true

      - name: Check signing secrets
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] \
            && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] \
            && [ -n "${ANDROID_KEY_ALIAS:-}" ] \
            && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
            test -s "$RUNNER_TEMP/keystore.jks"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_OUTPUT"
            echo "Signing secrets detected: signed release APK will be built."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Signing skipped::Signing secrets are incomplete. Only the debug APK will be built."
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug \
            -PserverUrl="${DS_SERVER_URL:-}" \
            --stacktrace

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease \
            -PserverUrl="${DS_SERVER_URL:-}" \
            --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ds-dianjing-apk
          path: '**/*.apk'
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: '**/*.apk'
          generate_release_notes: true
